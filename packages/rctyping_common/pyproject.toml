[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rctyping-common"
version = "0.1.0"
description = "Shared models, canonical JSON, crypto, and Merkle tree for rc-typing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=42.0.0",
    "pydantic>=2.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rctyping_common"]
