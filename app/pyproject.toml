[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rctyping-app"
version = "0.1.0"
description = "Web typing speed application with verifiable cryptographic certificates"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "rctyping-common",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic-settings>=2.5.0",
    "sqlalchemy>=2.0.30",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
rctyping-app = "rctyping_app.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rctyping_app"]
